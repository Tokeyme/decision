    .vorhang {

      align-items: center;
      padding: 16px;
      box-sizing: border-box;

    /* Mittig, solange Platz ist; die KI-Zeile darunter im Fluss, nicht über

       Adresszeile). */

    .kasten[hidden] { display: none; }
    .name {
      margin: 0 0 1rem;
      color: #D9A441;
      font-size: 1.6rem;
      font-weight: 700;

    .leise { color: #9C8B76; }

    p { line-height: 1.5; }
    button {

      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #E8D9BE; outline-offset: 3px; }
    /* Impressum und Datenschutz bleiben auch über dem Spiel erreichbar —
       klein, oben rechts. */
    .recht {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 2;
      padding: 2px 8px;

    }
    .recht a { color: #9C8B76; text-decoration: none; }
    .recht a:hover, .recht a:focus-visible { color: #E8D9BE; text-decoration: underline; }
    /* **Der Hinweis auf generierte Bilder und Musik** (Andreas, 26.10.2026:
       „ja, aber nicht aufdringlich und erst recht nicht überall; kann es auch
       ‚generiert‘ nennen“). Genau eine Zeile, nur hier im Vorhang — beim Laden
       und auf dem Hinweis für kleine Bildschirme —, nicht im Spiel und nicht
       in der ständigen Rechtsleiste. */
    .ki {
      flex-shrink: 0;
      margin: 12px 0 0;
      text-align: center;
      font-size: 11px;
      color: #6E6152;
    }
    /* Niedrige Schirme (Handy quer): etwas dichter, damit alles hineinpasst. */
    @media (max-height: 420px) {
      .vorhang { padding: 8px 16px; }
      .name { margin-bottom: 0.4rem; font-size: 1.3rem; }
      h1 { margin-bottom: 0.4rem; font-size: 1.2rem; }
      p { margin: 0.4em 0; line-height: 1.35; }
      button { margin-top: 0.3rem; }
    }
    /* **„Lädt nicht? Neu laden“** — erst nach einer Minute ohne Spiel
       (siehe starten()), so leise wie der Ladetext darüber. */
    .haengt button {
      margin: 0 0 0 0.3em;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    .haengt button:hover, .haengt button:focus-visible { color: #E8D9BE; }
    /* Nach dem japanischen ？ (volle Breite) kein Abstand mehr. */
    :lang(ja) .haengt button { margin-left: 0; }

  <script>
    // **Einstieg** (26.10.2026): Texte in der Sprache der Seite, der Hinweis
    // für kleine Bildschirme, dann das Spiel.
    (function () {
      'use strict';

      // Die Texte je Sprache stehen oben im Block „seitentexte“ — aus ihm
      // setzt auch tools/web_bauen.dart die festen Texte der Sprachseiten.
      var TEXTE = JSON.parse(document.getElementById('seitentexte').textContent);

      // Die Sprachseiten tragen ihre Sprache (data-sprache). Der Bauordner
      // selbst und `flutter run` nehmen die des Browsers — wie das Spiel:
      // die erste aus der Wunschliste, die es gibt, sonst Englisch.
      function spracheDerSeite() {
        var fest = document.documentElement.getAttribute('data-sprache');
        if (fest && TEXTE[fest]) return fest;
        var liste = navigator.languages && navigator.languages.length
          ? navigator.languages : [navigator.language || 'en'];
        for (var i = 0; i < liste.length; i++) {
          var kurz = String(liste[i]).toLowerCase().split('-')[0];
          if (TEXTE[kurz]) return kurz;
        }
        return 'en';
      }

      function setzen(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      // Alle Texte der Seite in einer Sprache — beim Start und wenn der
      // Spieler im Spiel die Sprache wechselt.
      function anwenden(sprache) {
        var t = TEXTE[sprache];
        document.documentElement.lang = sprache;
        setzen('name', t.name);
        setzen('hinweis-name', t.name);
        setzen('laden-text', t.laden);
        setzen('hinweis-titel', t.hinweisTitel);
        setzen('hinweis-text', t.hinweis);
        setzen('trotzdem', t.trotzdem);
        setzen('ki', t.ki);
        setzen('haengt-frage', t.haengt);
        setzen('neu-laden', t.neuLaden);
        setzen('impressum', t.impressum);
        setzen('datenschutz', t.datenschutz);
        document.getElementById('datenschutz').href = t.datenschutzAdresse;
      }
      anwenden(spracheDerSeite());
      setzen('adresse', location.host);

      // **Ruft das Spiel, wenn es die Sprache wechselt** (lib/ui/ablage_web.dart,
      // 26.10.2026). Den Pfad (/de/ → /fr/) hat es da schon per replaceState
      // umgeschrieben; hier folgen Sprache der Seite (Vorlesen, Glyphenformen
      // der Kanji), Rechtslinks und Datenschutz-Adresse.
      window.entscheiderSpracheGesetzt = function (sprache) {
        if (!TEXTE[sprache]) return;
        if (document.documentElement.getAttribute('data-sprache')) {
          document.documentElement.setAttribute('data-sprache', sprache);
        }
        anwenden(sprache);
      };

      // **Kleine Bildschirme** (26.10.2026; seit 06.11.2026 „Am Handy: bitte
      // quer“ statt „Am besten am Computer“ — am Handy ist es quer spielbar,
      // Andreas: „ja“): Das Spiel ist für große Bildschirme gemalt. Unter 900 Pixeln Breite oder auf einem Telefon
      // (nur grober Zeiger, kurze Kante unter 600) erst ein Hinweis — und
      // zwar VOR dem Laden: Wer es lässt, hat nicht schon Megabytes geladen.
      // „Trotzdem spielen“ merkt sich der Browser.
      var MERKER = 'entscheider.web.trotzdem';
      function gemerkt() {
        try { return localStorage.getItem(MERKER) === '1'; } catch (e) { return false; }
      }
      function merken() {
        try { localStorage.setItem(MERKER, '1'); } catch (e) { /* privates Fenster */ }
      }
      function kleinerBildschirm() {
        var breite = document.documentElement.clientWidth || window.innerWidth || 0;
        if (breite > 0 && breite < 900) return true;
        try {
          var nurGrob = window.matchMedia('(pointer: coarse)').matches &&
            !window.matchMedia('(any-pointer: fine)').matches;
          return nurGrob && Math.min(screen.width, screen.height) < 600;
        } catch (e) {
          return false;
        }
      }

      // **Scheitert der Start schon vor dem Spiel** (Browser-Prüfer
      // 26.10.2026: Engine-Start, WebAssembly gesperrt, Skriptfehler), bliebe
      // „Lädt …“ für immer stehen — die Frist unten (entscheiderLaeuft) läuft
      // erst nach runApp an. Deshalb: Hat das Spiel sich nach einer Minute
      // nicht gemeldet, bietet der Vorhang leise das Neuladen an. Geladen
      // wird weiter; auf einer langsamen Leitung kommt das Spiel trotzdem.
      var STARTFRIST = 60000;
      function haengtPruefen() {
        if (typeof window.entscheiderLaeuftUm === 'number') return;
        var zeile = document.getElementById('haengt');
        if (zeile) zeile.hidden = false;
      }
      document.getElementById('neu-laden').addEventListener('click', function () {
        location.reload();
      });

      var gestartet = false;
      function starten() {
        if (gestartet) return;
        gestartet = true;
        document.getElementById('hinweis').hidden = true;
        document.getElementById('laden').hidden = false;
        setTimeout(haengtPruefen, STARTFRIST);
        var skript = document.createElement('script');
        skript.src = 'flutter_bootstrap.js';
        skript.async = true;
        document.body.appendChild(skript);
      }

      // **Der Vorhang fällt, wenn das erste Bild MIT Schrift steht** — das
      // meldet das Spiel selbst (lib/ui/schrift.dart, SchriftTor). Auf
      // Japanisch wartet es auf seine Schrift; vorher stünde hier nur eine
      // leere dunkle Fläche.
      // `wer` steht für tools/web_probe.dart da: Fiel der Vorhang durch das
      // Spiel oder erst durch die Frist?
      window.entscheiderBereit = function (wer) {
        if (!window.entscheiderBereitUm) {
          window.entscheiderBereitUm = performance.now();
          window.entscheiderBereitDurch = wer || 'spiel';
        }
        var vorhang = document.getElementById('vorhang');
        if (vorhang) vorhang.remove();
      };
      // Ruft flutter_bootstrap.js, sobald runApp durch ist. Meldet sich das
      // Spiel danach nicht (Fehler im Spiel), fällt der Vorhang trotzdem —
      // nach mehr als der Frist, die das Spiel auf die japanische Schrift
      // wartet (10 s): Ein Spiel mit Kästchen ist besser als gar keins.
      window.entscheiderLaeuft = function () {
        window.entscheiderLaeuftUm = performance.now();
        setTimeout(function () { window.entscheiderBereit('frist'); }, 15000);
      };

      if (kleinerBildschirm() && !gemerkt()) {
        document.getElementById('laden').hidden = true;
        document.getElementById('hinweis').hidden = false;
        document.getElementById('trotzdem').addEventListener('click', function () {
          merken();
          // **Android: gleich Vollbild und quer** (06.11.2026) — im Klick
          // selbst, sonst lässt der Browser es nicht zu. Dasselbe tut das
          // Spiel beim ersten Fingertipp (lib/ui/ablage_web.dart,
          // querVollbild); ist das Vollbild schon da, lässt es das.
          try {
            var el = document.documentElement;
            if (/Android/.test(navigator.userAgent) && el.requestFullscreen &&
                !document.fullscreenElement &&
                !window.matchMedia('(display-mode: standalone)').matches &&
                !window.matchMedia('(display-mode: fullscreen)').matches) {
              el.requestFullscreen().then(function () {
                if (screen.orientation && screen.orientation.lock) {
                  return screen.orientation.lock('landscape');
                }
              }).catch(function () { /* abgelehnt: bleibt, wie es ist */ });
            }
          } catch (e) { /* alter Browser */ }
          // **Den Ton schon jetzt freischalten** (06.11.2026): Safari gibt
          // ihn je Audio-Element frei und nur in einer Geste — dieser Tipp
          // ist eine. Das Element übernimmt das Spiel (lib/ui/ton_web.dart),
          // so spielt das Radio gleich, ohne einen weiteren Tipp.
          try {
            var ton = new Audio();
            ton.style.display = 'none';
            document.body.appendChild(ton);
            window.entscheiderTon = ton;
            var versuch = ton.play();
            ton.pause();
            if (versuch && versuch.then) {
              versuch.then(function () { window.entscheiderTonFrei = true; },
                function (e) {
                  if (!e || e.name !== 'NotAllowedError') {
                    window.entscheiderTonFrei = true;
                  }
                });
            }
          } catch (e) { /* ohne Ton weiter */ }
          starten();
        });
      } else {
        starten();
      }
    })();
  </script>
